<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2026决战中考倒计时</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

/* 海报容器 */
.poster{

    position:relative;

    width:100vw;
    height:100vh;

    background:url("bg.png")
               center center
               no-repeat;

    background-size:cover;
}

/* 黄色框中的倒计时 */
.countdown{

    position:absolute;

    /* 根据当前海报比例定位 */
    left:29%;
    top:75%;

    width:42%;
    height:8%;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;

    font-weight:900;

    color:#8b0000;

    text-align:center;

    white-space:nowrap;

    text-shadow:
        0 1px 1px rgba(255,255,255,.35);

    font-size:clamp(32px,3vw,68px);

    letter-spacing:2px;
}

/* 手机端优化 */
@media (max-width:768px){

    .countdown{

        left:23%;
        width:54%;

        top:75%;

        font-size:clamp(18px,4vw,36px);

        letter-spacing:1px;
    }
}

</style>
</head>
<body>

<div class="poster">

    <div class="countdown" id="timer">
        365天 00时 00分 00秒
    </div>

</div>

<script>

/*
 * 修改这里即可
 * 根据当地中考时间调整
 */
const targetDate = new Date(
    "2026-06-17 08:30:00"
);

function updateCountdown(){

    const now = new Date();

    const diff = targetDate - now;

    if(diff <= 0){

        document.getElementById("timer").innerHTML =
        "考试开始";

        return;
    }

    const days = Math.floor(
        diff / (1000 * 60 * 60 * 24)
    );

    const hours = Math.floor(
        (diff % (1000 * 60 * 60 * 24))
        / (1000 * 60 * 60)
    );

    const minutes = Math.floor(
        (diff % (1000 * 60 * 60))
        / (1000 * 60)
    );

    const seconds = Math.floor(
        (diff % (1000 * 60))
        / 1000
    );

    document.getElementById("timer").innerHTML =
        `${days}天 ${String(hours).padStart(2,'0')}时 ${String(minutes).padStart(2,'0')}分 ${String(seconds).padStart(2,'0')}秒`;
}

updateCountdown();

setInterval(updateCountdown,1000);

</script>

</body>
</html>
