<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2026决战中考倒计时</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

/* 背景海报 */
.poster{
    position:relative;
    width:100vw;
    height:100vh;

    background:url("bg.png")
              center center
              no-repeat;

    background-size:cover;
}

/* 倒计时区域 */
.countdown{

    position:absolute;

    left:50%;
    top:79%;

    transform:translate(-50%,-50%);

    width:30%;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* 卡片 */
.time-card{

    width:90px;
    height:98px;

    background:#2f3136;

    border-radius:8px;

    box-shadow:
        0 6px 15px rgba(0,0,0,.35);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

/* 数字 */
.num{

    color:#fff;

    font-size:56px;
    font-weight:700;

    line-height:1;
}

/* 天时分秒 */
.label{

    color:#fff;

    font-size:24px;

    margin-top:8px;
}

/* 平板 */
@media (max-width:1024px){

    .countdown{
        width:50%;
    }

    .time-card{
        width:75px;
        height:90px;
    }

    .num{
        font-size:46px;
    }

    .label{
        font-size:18px;
    }
}

/* 手机 */
@media (max-width:768px){

    .countdown{

        width:70%;

        top:80%;
    }

    .time-card{

        width:52px;
        height:64px;
    }

    .num{

        font-size:28px;
    }

    .label{

        font-size:12px;
        margin-top:3px;
    }
}

</style>
</head>

<body>

<div class="poster">

    <div class="countdown">

        <div class="time-card">
            <div class="num" id="days">365</div>
            <div class="label">天</div>
        </div>

        <div class="time-card">
            <div class="num" id="hours">00</div>
            <div class="label">时</div>
        </div>

        <div class="time-card">
            <div class="num" id="minutes">00</div>
            <div class="label">分</div>
        </div>

        <div class="time-card">
            <div class="num" id="seconds">00</div>
            <div class="label">秒</div>
        </div>

    </div>

</div>

<script>

/*
 修改这里即可
 江西2026中考时间
*/
const targetDate =
new Date("2026-06-17 08:30:00");

function updateCountdown(){

    const now = new Date();

    const diff = targetDate - now;

    if(diff <= 0){

        document.querySelector(".countdown").innerHTML =
        '<div style="color:white;font-size:48px;font-weight:bold;">考试开始</div>';

        return;
    }

    const days =
        Math.floor(diff/(1000*60*60*24));

    const hours =
        Math.floor(
            diff%(1000*60*60*24)
            /(1000*60*60)
        );

    const minutes =
        Math.floor(
            diff%(1000*60*60)
            /(1000*60)
        );

    const seconds =
        Math.floor(
            diff%(1000*60)
            /1000
        );

    document.getElementById("days").innerText =
        String(days).padStart(2,'0');

    document.getElementById("hours").innerText =
        String(hours).padStart(2,'0');

    document.getElementById("minutes").innerText =
        String(minutes).padStart(2,'0');

    document.getElementById("seconds").innerText =
        String(seconds).padStart(2,'0');
}

updateCountdown();

setInterval(updateCountdown,1000);

</script>

</body>
</html>
